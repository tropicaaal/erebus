[package]
name = "erebus-backend-d3d11"
version = "0.1.0"
edition = "2024"

[lib]
name = "d3d11"
crate-type = ["cdylib"]

[dependencies]
erebus-engine = { workspace = true }
erebus-theme = { workspace = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }
fxhash = "0.2.1"
log = "0.4"

[build-dependencies]
goblin = "0.9"

[profile.release]
panic = "unwind"
